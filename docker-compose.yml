networks:
  vuln-lab:
    driver: bridge
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET}

volumes:
  security-logs:
  ftp-data:

services:
  # === SERVICES VULNÉRABLES POUR ÉDUCATION ===
  # Les versions choisies contiennent des CVE spécifiques pour les exercices du TP

  target-ssh:
    image: rastasheep/ubuntu-sshd:16.04  # Ubuntu 16.04 with OpenSSH 7.2p2 (CVE-2016-0777)
    container_name: vuln-ssh
    environment:
      - ROOT_PASSWORD=password
    command: sh -c "useradd -m -s /bin/bash user && echo 'user:password' | chpasswd && /usr/sbin/sshd -D"
    ports:
      - "2200:22"      # SSH standard accessible via port 2200 (avoids host SSH conflict)
      - "2222:22"      # Port non-standard pour exercices
    networks:
      vuln-lab:
        ipv4_address: ${SSH_TARGET_IP}
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  target-ftp-vsftpd:
    image: fauria/vsftpd:latest  # vsftpd avec configuration vulnérable pour exercices pratiques
    container_name: vuln-ftp-vsftpd
    environment:
      - FTP_USER=admin
      - FTP_PASS=admin  # Mot de passe faible pour démonstration brute force
      - PASV_ADDRESS=${FTP_VSFTPD_IP}
      - ANONYMOUS=YES  # Accès anonyme activé (risque sécurité)
    ports:
      - "21:21"
      - "30000-30009:30000-30009"  # Ports PASV
    volumes:
      - ftp-data:/home/vsftpd
    networks:
      vuln-lab:
        ipv4_address: ${FTP_VSFTPD_IP}
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  target-ftp-pure:
    image: stilliard/pure-ftpd:hardened
    container_name: vuln-ftp-pure
    environment:
      - PUBLICHOST=${FTP_PURE_IP}
      - FTP_USER_NAME=anonymous
      - FTP_USER_PASS=
    ports:
      - "2121:21"
    volumes:
      - ./data/ftp:/home/ftpusers
    networks:
      vuln-lab:
        ipv4_address: ${FTP_PURE_IP}
        aliases:
          - ftp-pure
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M

  target-web-dvwa:
    image: vulnerables/web-dvwa:latest
    container_name: vuln-web-dvwa
    environment:
      - MYSQL_DATABASE=dvwa
      - MYSQL_USER=dvwa
      - MYSQL_PASSWORD=password
    ports:
      - "80:80"
    networks:
      vuln-lab:
        ipv4_address: ${WEB_DVWA_IP}
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  target-web-apache:
    image: httpd:2.4.41-alpine  # Apache 2.4.41 vulnérable à CVE-2011-3192 (Range Header DoS)
    container_name: vuln-web-apache
    ports:
      - "8080:80"
    volumes:
      - ./configs/apache/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
    networks:
      vuln-lab:
        ipv4_address: ${WEB_APACHE_IP}
        aliases:
          - apache-status
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M

  target-web-nginx:
    image: nginx:1.18.0-alpine  # nginx 1.18.0 avec vulnérabilités détectables par NSE
    container_name: vuln-web-nginx
    ports:
      - "8081:80"
    volumes:
      - ./configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data/web:/usr/share/nginx/html:ro
    networks:
      vuln-lab:
        ipv4_address: ${WEB_NGINX_IP}
        aliases:
          - nginx-listing
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M

  monitor-suricata:
    image: jasonish/suricata:latest
    container_name: vuln-monitor-suricata
    command: suricata -c /etc/suricata/suricata.yaml -i eth0 -v
    volumes:
      - ./configs/suricata/suricata.yaml:/etc/suricata/suricata.yaml:ro
      - ./configs/suricata/rules:/etc/suricata/rules:ro
      - security-logs:/var/log/suricata
    networks:
      vuln-lab:
        ipv4_address: ${MONITOR_SURICATA_IP}
    cap_add:
      - NET_ADMIN
      - NET_RAW
    privileged: true
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  monitor-zeek:
    image: zeek/zeek:latest
    container_name: vuln-monitor-zeek
    command: sh -c "cd /logs && /usr/local/zeek/bin/zeek -i eth0 -C"
    volumes:
      - security-logs:/logs
    networks:
      vuln-lab:
        ipv4_address: ${MONITOR_ZEEK_IP}
    cap_add:
      - NET_ADMIN
      - NET_RAW
    privileged: true
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M