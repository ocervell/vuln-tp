networks:
  vuln-lab:
    driver: bridge
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET}

volumes:
  security-logs:
  ftp-data:

services:
  target-ssh:
    image: lscr.io/linuxserver/openssh-server:latest
    container_name: vuln-ssh
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Paris
      - PASSWORD_ACCESS=true
      - USER_PASSWORD=password
      - USER_NAME=user
    ports:
      - "2200:22"      # SSH standard accessible via port 2200 (avoids host SSH conflict)
      - "2222:22"      # Port non-standard pour exercices
    networks:
      vuln-lab:
        ipv4_address: ${SSH_TARGET_IP}
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  target-ftp-vsftpd:
    image: fauria/vsftpd:latest
    container_name: vuln-ftp-vsftpd
    environment:
      - FTP_USER=admin
      - FTP_PASS=admin
      - PASV_ADDRESS=${FTP_VSFTPD_IP}
    ports:
      - "21:21"
    volumes:
      - ftp-data:/home/vsftpd
    networks:
      vuln-lab:
        ipv4_address: ${FTP_VSFTPD_IP}
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  target-ftp-pure:
    image: stilliard/pure-ftpd:hardened
    container_name: vuln-ftp-pure
    environment:
      - PUBLICHOST=${FTP_PURE_IP}
      - FTP_USER_NAME=anonymous
      - FTP_USER_PASS=
    ports:
      - "2121:21"
    volumes:
      - ./data/ftp:/home/ftpusers
    networks:
      vuln-lab:
        ipv4_address: ${FTP_PURE_IP}
        aliases:
          - ftp-pure
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M

  target-web-dvwa:
    image: vulnerables/web-dvwa:latest
    container_name: vuln-web-dvwa
    environment:
      - MYSQL_DATABASE=dvwa
      - MYSQL_USER=dvwa
      - MYSQL_PASSWORD=password
    ports:
      - "80:80"
    networks:
      vuln-lab:
        ipv4_address: ${WEB_DVWA_IP}
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  target-web-apache:
    image: httpd:2.4.41-alpine
    container_name: vuln-web-apache
    ports:
      - "8080:80"
    volumes:
      - ./configs/apache/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro
    networks:
      vuln-lab:
        ipv4_address: ${WEB_APACHE_IP}
        aliases:
          - apache-status
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M

  target-web-nginx:
    image: nginx:1.18.0-alpine
    container_name: vuln-web-nginx
    ports:
      - "8081:80"
    volumes:
      - ./configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data/web:/usr/share/nginx/html:ro
    networks:
      vuln-lab:
        ipv4_address: ${WEB_NGINX_IP}
        aliases:
          - nginx-listing
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M

  monitor-suricata:
    image: jasonish/suricata:latest
    container_name: vuln-monitor-suricata
    command: suricata -c /etc/suricata/suricata.yaml -i eth0
    volumes:
      - ./configs/suricata/suricata.yaml:/etc/suricata/suricata.yaml:ro
      - ./configs/suricata/rules:/etc/suricata/rules:ro
      - security-logs:/var/log/suricata
    networks:
      vuln-lab:
        ipv4_address: ${MONITOR_SURICATA_IP}
    cap_add:
      - NET_ADMIN
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

